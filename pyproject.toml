[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neighbors"
description = "NYC rental finder with KNN similarity search and a local web UI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = ["requests>=2.31", "keyring>=24"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-playwright>=0.5"]

# `pip install .` gives you the `neighbors` command (neighbors, neighbors web, …)
[project.scripts]
neighbors = "neighbors.cli:main"

[tool.setuptools]
packages = ["neighbors", "neighbors.providers"]

# ship the non-Python assets the app needs at runtime
[tool.setuptools.package-data]
neighbors = ["web.html", "neighborhoods.json"]

[tool.setuptools.dynamic]
version = { attr = "neighbors.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: browser tests (need `playwright install chromium`)"]
